<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recommendation Letters · Lily Wu</title>
<link rel="stylesheet" href="style.css?v=4">
<script src="prefs.js?v=4"></script>
</head>
<body>
<header class="topbar gutter"><div class="in"><div class="brand"><span class="em">✉️</span><span id="brand">Recommendation letters</span></div><div id="tools"></div></div></header>
<main class="shell gutter" id="app"><p class="muted">Loading…</p></main>
<dialog class="welcome" id="welcome" aria-labelledby="w-title"></dialog>
<script type="module">
import { firebaseConfig } from './firebase-config.js?v=4';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, onSnapshot, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

document.getElementById('tools').innerHTML = '<div class="tools"><button class="tool help" id="howto" hidden><span class="q" aria-hidden="true">?</span><span class="help-t">How this page works</span></button><span class="sep" aria-hidden="true"></span></div>' + (window.RLPrefs ? RLPrefs.controls() : '');
document.getElementById('howto').onclick = () => { if (P) showWelcome(); };
window.RLPrefs && RLPrefs.wire();

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const METHOD = {
  portal: 'Upload through the link in the school’s invitation email',
  email: 'Email the letter',
  mail: 'Send by mail',
  link: 'Upload at the link'
};
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse = d => { if (!d) return null; const [y, m, x] = d.split('-').map(Number); return new Date(y, m - 1, x); };
const fmt = d => { const x = parse(d); return x ? MON[x.getMonth()] + ' ' + x.getDate() : ''; };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const daysLeft = d => { const x = parse(d); return x ? Math.round((x - today()) / 864e5) : null; };
const byDue = (a, b) => (!a.due) - (!b.due) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

const token = location.hash.replace(/^#/, '');
let P = null, toast = '', busy = false, welcomed = false;
const openSecs = new Set(['materials']);

if (!token) {
  app.innerHTML = '<div class="center"><div class="big">✉️</div><h1>Recommendation letters</h1><p>Please open the personal link Lily sent you by email.</p></div>';
} else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const ref = doc(db, 'pages', token);
  onSnapshot(ref, snap => {
    if (!snap.exists()) { app.innerHTML = '<div class="center"><div class="big">✉️</div><h1>This link doesn’t open a page</h1><p>Please use the exact link from Lily’s email, or reply to her and she’ll resend it.</p></div>'; return; }
    P = snap.data(); document.getElementById('howto').hidden = false; render(); maybeWelcome();
  }, () => { app.innerHTML = '<div class="center"><h1>Can’t load right now</h1><p>Please refresh in a minute.</p></div>'; });

  app.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-sec]')) { d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec); } }, true);
  app.addEventListener('click', async e => {
    const box = e.target.closest('[data-tick]');
    if (!box || busy) return;
    const id = box.dataset.tick, s = P.schools.find(x => x.id === id);
    const was = P.status[id] || 'todo';
    const now = was === 'submitted' ? ((P.invitedOn || {})[id] ? 'invited' : 'todo') : 'submitted';
    busy = true; P.status[id] = now; toast = ''; render();
    try {
      await updateDoc(ref, { ['status.' + id]: now, statusAt: serverTimestamp() });
      toast = now === 'submitted' ? 'Checked off ' + s.program + '. Thank you!' : 'Unchecked ' + s.program + '.';
    } catch (err) {
      P.status[id] = was; toast = 'That didn’t save. Please try again, or send Lily an email at wulily@usc.edu.';
    }
    busy = false; render();
  });
}

function sec(id, icon, title, count, body) {
  return '<details class="sec" data-sec="' + id + '"' + (openSecs.has(id) ? ' open' : '') + '><summary><span class="si">' + icon + '</span><span class="st">' + title + '</span><span class="sc">' + count + '</span><span class="chev">▶</span></summary><div class="body">' + body + '</div></details>';
}

function render() {
  const mine = P.schools.slice().sort(byDue);
  const todo = mine.filter(s => P.status[s.id] !== 'submitted');
  const done = mine.filter(s => P.status[s.id] === 'submitted');
  const next = todo.find(s => s.due);
  const dl = next ? daysLeft(next.due) : null;
  document.getElementById('brand').textContent = 'Letters for ' + ((P.profile || {}).name || P.student || 'Lily');

  const pf = Object.assign({ photo: 'avatar.jpg' }, P.profile || {});
  if (!pf.photo) pf.photo = 'avatar.jpg';
  const name = pf.name || P.student || 'Lily';
  const initials = name.replace(/\(.*?\)/g, '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const hero = '<section class="hero"><h1>' + (P.salutation ? 'Hi ' + esc(P.salutation) + ' \ud83d\udc4b' : 'Recommendation letters') + '</h1>' +
    '<p class="muted">Thank you for writing my recommendation letters. Updated ' + fmt(P.updated) + '.</p>' +
    (P.note ? '<div class="callout"><span>\ud83d\udc8c</span><p>' + esc(P.note) + '</p></div>' : '') + '</section>';
  let h = '';
  const mats = P.materials || [], pts = P.points || [], ctx = P.context || [];
  h += '<div class="cols"><aside class="side">';
  h += '<div class="me">' + (pf.photo ? '<img class="avatar" src="' + esc(pf.photo) + '" alt="' + esc(name) + '">' : '<div class="avatar initials" aria-hidden="true">' + esc(initials) + '</div>') +
    '<div class="me-name">' + esc(name) + '</div>' + (pf.tagline ? '<div class="me-tag">' + esc(pf.tagline) + '</div>' : '') +
    '<div class="me-links">' + (pf.website ? '<a href="' + esc(pf.website) + '" target="_blank" rel="noopener">\ud83c\udf10 Website</a>' : '') + (pf.email ? '<a href="mailto:' + esc(pf.email) + '">\u2709\ufe0f ' + esc(pf.email) + '</a>' : '') + '</div></div>';
  h += sec('materials', '📎', 'My materials', mats.filter(m => m.url).length + ' of ' + mats.length,
    '<ul class="files">' + mats.map(m => m.url
      ? '<li><a href="' + esc(m.url) + '" target="_blank" rel="noopener">📄 ' + esc(m.label) + (m.updated ? '<span class="d">' + fmt(m.updated) + '</span>' : '') + '</a></li>'
      : '<li><span class="off">📄 ' + esc(m.label) + '<span class="d">coming soon</span></span></li>').join('') + '</ul>');
  h += sec('highlights', '✨', 'What to highlight', pts.length ? pts.length : '',
    pts.length ? '<p class="muted" style="margin:0 0 8px">If it fits your letter, I’d love you to speak to:</p><ul>' + pts.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p class="muted" style="margin:0">Coming soon.</p>');
  h += sec('together', '🎓', 'Our work together', ctx.length ? ctx.length : '',
    ctx.length ? '<ul>' + ctx.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p class="muted" style="margin:0">Coming soon.</p>');
  h += sec('submit', '📮', 'How to submit', '',
    '<div class="subs">' + mine.map(s => {
      const m = s.method || 'portal';
      let how = esc(s.howto || METHOD[m]);
      if (m === 'portal' && s.from) how += '. Look for an email from “' + esc(s.from) + '”';
      if (s.link) how += ' · <a href="' + esc(s.link) + '" target="_blank" rel="noopener">' + (m === 'email' || m === 'mail' ? esc(s.link) : 'Open link') + '</a>';
      return '<div><b>' + esc(s.program) + '</b><span class="muted">' + how + '</span></div>';
    }).join('') + '</div>');
  const mail = pf.email || 'wulily@usc.edu';
  h += '<p class="muted foot">Questions? <a href="mailto:' + esc(mail) + '">Send me an email</a> at ' + esc(mail) + '.</p>';
  h += '</aside>';

  const pct = mine.length ? Math.round(done.length / mine.length * 100) : 0;
  h += '<div class="right">' + hero + '<section class="main"><div class="main-head"><div class="row"><h2>Checklist</h2><span class="muted">' + done.length + ' of ' + plural(mine.length, 'letter') + ' submitted</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + mine.length + '" aria-valuenow="' + done.length + '"><span style="width:' + pct + '%"></span></div>' +
    (next ? '<p class="muted" style="margin:0">Next due: <b style="color:var(--text)">' + esc(next.program) + '</b>, ' + fmt(next.due) + (dl != null && dl >= 0 ? ' (' + (dl === 0 ? 'today' : dl === 1 ? 'tomorrow' : dl + ' days') + ')' : '') + '. Tick a school when you’ve submitted.</p>' : '<p class="muted" style="margin:0">All letters are in. Thank you so much!</p>') +
    '</div><ul class="todo">';
  todo.concat(done).forEach(s => {
    const st = P.status[s.id] || 'todo', isDone = st === 'submitted', d = daysLeft(s.due);
    let sub;
    if (isDone) sub = 'Submitted';
    else if ((s.method || 'portal') === 'portal') sub = st === 'invited' ? 'Invitation sent' + ((P.invitedOn || {})[s.id] ? ' ' + fmt(P.invitedOn[s.id]) : '') + (s.from ? ' · from “' + esc(s.from) + '”' : '') : 'Invitation email coming soon';
    else sub = esc(s.howto || METHOD[s.method]);
    h += '<li class="' + (isDone ? 'done' : '') + '"><button class="cb" role="checkbox" aria-checked="' + isDone + '" aria-label="Submitted: ' + esc(s.program) + '" data-tick="' + s.id + '"' + (busy ? ' disabled' : '') + '>✓</button>' +
      '<span><span class="name">' + esc(s.program) + '</span><span class="sub">' + sub + '</span></span>' +
      '<span class="due"><span>' + (s.due ? fmt(s.due) : 'TBD') + (s.time && !isDone ? ', ' + esc(s.time) : '') + '</span>' + (!isDone && d != null && d >= 0 && d <= 10 ? '<span class="tag orange">' + (d === 0 ? 'today' : d + ' days') + '</span>' : '') + '</span></li>';
  });
  h += '</ul><div class="toast" role="status">' + esc(toast) + '</div></section></div></div>';
  app.innerHTML = h;
}

function maybeWelcome() {
  if (welcomed) return; welcomed = true;
  if (!store.get('rl-welcomed-' + token)) showWelcome();
}
function showWelcome() {
  const d = document.getElementById('welcome');
  d.innerHTML = '<form method="dialog" class="w-in">' +
    '<div class="w-hi">👋</div>' +
    '<h2 id="w-title">' + (P.salutation ? 'Hi ' + esc(P.salutation) + ',' : 'Hi there,') + '</h2>' +
    '<p>Thank you so much for writing for me. I made this page so everything you need is in one place, and you never have to dig through old emails.</p>' +
    '<ol>' +
      '<li><span class="wi">📎</span><span><b>Everything you need is in the side panel</b><span class="ws">My CV and statements, what I’d love you to highlight, and how each school takes letters.</span></span></li>' +
      '<li><span class="wi">☑️</span><span><b>Tick a school when you submit</b><span class="ws">I’ll see it right away, so there’s no need to email me each time.</span></span></li>' +
      '<li><span class="wi">📬</span><span><b>Invitations come from each school</b><span class="ws">If one is missing or a link has expired, send me an email and I’ll resend it.</span></span></li>' +
    '</ol>' +
    '<p class="ws" style="margin:0">You can open this again anytime from <b style="display:inline">? How this page works</b> at the top.</p>' +
    '<div class="w-actions"><span class="sig">With gratitude, Lily</span><button class="btn primary" value="ok" autofocus>Sounds good</button></div>' +
    '</form>';
  d.onclose = () => store.set('rl-welcomed-' + token, '1');
  if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', '');
}
</script>
</body>
</html>
